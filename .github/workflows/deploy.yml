# Publishes the app to GitHub Pages on every push to the default branch.
#
# The app is entirely client-side, so there is nothing to host but static
# files — and nothing anybody uploads ever leaves their own browser, which
# stays true however it is served.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
        # Turns Pages on for the repository the first time this runs, so the
        # site does not depend on somebody remembering a settings toggle.
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
