# Publishes the app to GitHub Pages, on request.
#
# Run it from the Actions tab once Pages is available to workflows. Two
# settings decide that, and neither can be set from here:
#
#   Settings → Actions → General → Workflow permissions → Read and write
#   Settings → Pages → Source → GitHub Actions
#
# Without them the publish step fails with "Resource not accessible by
# integration", which is what this workflow being manual keeps out of the
# push notifications.
#
# Vercel needs none of this: import the repository, framework preset Vite,
# build `npm run build`, output `dist`.
name: Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
